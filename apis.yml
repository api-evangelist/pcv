aid: pcv
name: PCV
description: >-
  Precision Cardiovascular (PCV) is a UK-based digital-health company advancing
  cardiovascular care through continuous, AI-powered heart-failure monitoring.
  Its flagship PULSENSE system pairs an implantable pulmonary-artery-pressure
  (PAP) sensor insert and a wearable smart chest patch with an AI-powered
  clinical app that surfaces real-time pressure trends and analytics for
  clinicians and patients. The platform is designed to catch PAP fluctuations
  that traditional spot-check measurements miss, including overnight and during
  activity. PCV PULSENSE is an investigational device under regulatory review
  (FDA, MHRA, EMA) and is not yet approved for commercial sale. The company was
  surfaced as a portfolio company of 500 Global and profiled in the API
  Evangelist network; it publishes no public API, developer portal, or SDK at
  this time.
